<canvas id="c"></canvas>

<script>
const c=document.getElementById('c'),out=document.getElementById('out');
let taps=0;document.getElementById('chip').onclick=()=>{taps++;if(taps<3)return;taps=0;
  const img=document.getElementById('card');
  {
    c.width=img.naturalWidth;c.height=img.naturalHeight;
    const ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(img,0,0);
    const d=ctx.getImageData(0,0,c.width,c.height).data;
    const bytes=[];let bits=0,n=0,ok=false;
    for(let i=0;i<d.length&&bytes.length<2000;i++){
      if(i%4===3) continue;
      bits=(bits<<1)|(d[i]&1);n++;
      if(n===8){ if(bits===0){ok=true;break;} bytes.push(bits);bits=0;n=0; }
    }
    let txt='';
    try{txt=new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(bytes));}catch(_){}
    out.style.display='block';
    out.textContent=(ok&&txt.trim())?'🏆 '+txt:'❌ Indha image la hidden message illa (illa image compress aagirukku).';
  }
};
